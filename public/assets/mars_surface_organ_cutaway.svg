<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="system-ui, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c9a0"/><stop offset="1" stop-color="#d9a878"/>
    </linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a05532"/><stop offset="1" stop-color="#6e3a20"/>
    </linearGradient>
    <pattern id="eds" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#3d2b1f"/>
      <path d="M0 10 L10 0 M-2 2 L2 -2 M8 12 L12 8" stroke="#e8a04c" stroke-width="1.2"/>
    </pattern>
    <pattern id="thermal" width="16" height="14" patternUnits="userSpaceOnUse">
      <rect width="16" height="14" fill="#7a4a2e"/>
      <rect x="3" y="2" width="10" height="10" rx="2" fill="#c98d5a" stroke="#4a2a18" stroke-width="0.8"/>
    </pattern>
    <pattern id="diel" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#2e3d4a"/>
      <circle cx="6" cy="6" r="2.2" fill="none" stroke="#7fb3c9" stroke-width="0.9"/>
    </pattern>
    <pattern id="hotring" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#8a3b28"/>
      <path d="M0 7 H14" stroke="#d97548" stroke-width="1.4"/>
    </pattern>
    <pattern id="berm" width="22" height="22" patternUnits="userSpaceOnUse">
      <rect width="22" height="22" fill="none"/>
      <circle cx="5" cy="6" r="1.6" fill="#5c331d"/><circle cx="15" cy="14" r="2" fill="#4a2817"/>
      <circle cx="11" cy="4" r="1.2" fill="#7a4a2e"/><circle cx="19" cy="8" r="1.1" fill="#5c331d"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>

  <!-- sky + regolito -->
  <rect width="960" height="560" fill="url(#sky)"/>
  <rect y="400" width="960" height="160" fill="url(#soil)"/>
  <path d="M0 400 Q140 384 300 400 T640 398 T960 402 V560 H0 Z" fill="#8a4c2c" opacity="0.55"/>
  <ellipse cx="140" cy="470" rx="120" ry="26" fill="#7a4526" opacity="0.5"/>
  <ellipse cx="780" cy="500" rx="160" ry="30" fill="#5c331d" opacity="0.45"/>

  <!-- berm passivo (talude de regolito na base externa) -->
  <path d="M30 560 L390 560 L390 430 Q260 470 170 505 Q90 535 30 560 Z" fill="url(#berm)" stroke="#4a2a18" stroke-width="1.5"/>
  <path d="M390 430 Q260 470 170 505 Q90 535 30 560" fill="none" stroke="#c98d5a" stroke-width="2" opacity="0.7"/>

  <!-- parede: 5 camadas (externa -> interna) -->
  <!-- 1. pele composta basáltica -->
  <rect x="392" y="90" width="34" height="470" fill="#6e3a20" stroke="#3a1e10" stroke-width="1.5"/>
  <path d="M392 160 h34 M392 240 h34 M392 320 h34 M392 400 h34 M392 480 h34" stroke="#3a1e10" stroke-width="1"/>
  <!-- 2. grade EDS -->
  <rect x="428" y="90" width="26" height="470" fill="url(#eds)" stroke="#e8a04c" stroke-width="1.2"/>
  <!-- 3. núcleo térmico -->
  <rect x="456" y="90" width="58" height="470" fill="url(#thermal)" stroke="#4a2a18" stroke-width="1.2"/>
  <!-- 4. anel quente estrutural -->
  <rect x="516" y="90" width="30" height="470" fill="url(#hotring)" stroke="#5c2a1a" stroke-width="1.2"/>
  <!-- 5. dielétrica interna -->
  <rect x="548" y="90" width="22" height="470" fill="url(#diel)" stroke="#2a3a48" stroke-width="1.2"/>

  <!-- interior -->
  <rect x="570" y="90" width="390" height="470" fill="#efe4d0" opacity="0.92"/>
  <rect x="570" y="90" width="390" height="470" fill="none" stroke="#3a2a1a" stroke-width="1.6"/>
  <rect x="388" y="86" width="576" height="478" fill="none" stroke="#2a1a0e" stroke-width="2.5"/>

  <!-- módulos internos simplificados -->
  <rect x="600" y="200" width="150" height="90" rx="6" fill="#c9d6b8" stroke="#5a6a48"/>
  <rect x="600" y="210" width="150" height="14" rx="4" fill="#7fae6a"/>
  <rect x="600" y="230" width="150" height="14" rx="4" fill="#9cc486"/>
  <rect x="600" y="250" width="150" height="14" rx="4" fill="#7fae6a"/>
  <rect x="780" y="200" width="140" height="90" rx="6" fill="#d8cfc0" stroke="#6a5a44"/>
  <circle cx="820" cy="245" r="18" fill="#8fb3c9" stroke="#4a6a80"/>
  <circle cx="880" cy="245" r="18" fill="#8fb3c9" stroke="#4a6a80"/>
  <rect x="600" y="330" width="320" height="10" rx="4" fill="#b07a4a"/>
  <rect x="600" y="360" width="90" height="70" rx="6" fill="#a8b8c8" stroke="#4a5a6a"/>
  <rect x="710" y="360" width="90" height="70" rx="6" fill="#c8b8a8" stroke="#6a5a4a"/>
  <rect x="820" y="360" width="100" height="70" rx="6" fill="#b8c8a8" stroke="#5a6a4a"/>

  <!-- indicação EDS ativa (carga) -->
  <path d="M436 120 l4 -8 l4 8 M436 300 l4 -8 l4 8 M436 470 l4 -8 l4 8" stroke="#ffd27a" stroke-width="1.6" fill="none" filter="url(#glow)"/>

  <!-- leader lines + labels -->
  <g font-size="13" fill="#2a1a0e">
    <path d="M230 470 L397 470" stroke="#2a1a0e" stroke-width="1"/><circle cx="397" cy="470" r="3"/>
    <text x="224" y="490" text-anchor="end" font-weight="600">PASSIVE BERM</text>
    <text x="224" y="506" text-anchor="end" font-size="11" fill="#5c331d">talude de regolito — defesa eólica passiva (v16)</text>

    <path d="M180 150 L400 150" stroke="#2a1a0e" stroke-width="1"/><circle cx="400" cy="150" r="3"/>
    <text x="176" y="146" text-anchor="end" font-weight="600">1 · COMPOSITE SKIN</text>
    <text x="176" y="162" text-anchor="end" font-size="11" fill="#5c331d">painel basáltico sinterizado</text>

    <path d="M180 230 L434 230" stroke="#2a1a0e" stroke-width="1"/><circle cx="434" cy="230" r="3"/>
    <text x="176" y="226" text-anchor="end" font-weight="600">2 · EDS GRID</text>
    <text x="176" y="242" text-anchor="end" font-size="11" fill="#5c331d">varredura eletrostática da poeira</text>

    <path d="M180 310 L480 310" stroke="#2a1a0e" stroke-width="1"/><circle cx="480" cy="310" r="3"/>
    <text x="176" y="306" text-anchor="end" font-weight="600">3 · THERMAL CORE</text>
    <text x="176" y="322" text-anchor="end" font-size="11" fill="#5c331d">canais de isolamento</text>

    <path d="M760 150 L528 150" stroke="#2a1a0e" stroke-width="1"/><circle cx="528" cy="150" r="3"/>
    <text x="764" y="146" font-weight="600">4 · HOT RING</text>
    <text x="764" y="162" font-size="11" fill="#5c331d">estrutural — inércia térmica</text>

    <path d="M700 480 L556 480" stroke="#2a1a0e" stroke-width="1"/><circle cx="556" cy="480" r="3"/>
    <text x="704" y="476" font-weight="600">5 · DIELECTRIC</text>
    <text x="704" y="492" font-size="11" fill="#5c331d">revestimento interno isolante</text>
  </g>

  <!-- exterior/interior tags -->
  <text x="120" y="80" font-size="12" font-weight="700" fill="#5c331d" letter-spacing="3">EXTERIOR — MARTE</text>
  <text x="760" y="110" font-size="12" font-weight="700" fill="#5c4a2e" letter-spacing="3">INTERIOR — HABITAT</text>
  <text x="392" y="76" font-size="15" font-weight="700" fill="#3a1e10">SurfaceOrgan — corte transversal da parede (5 camadas + berm)</text>

  <!-- veto energético: pool -->
  <g font-size="11" fill="#2a1a0e">
    <rect x="600" y="452" width="14" height="14" fill="#e8a04c" stroke="#6a4a20"/>
    <text x="622" y="464">EDS e forno sinter debitam do pool único de 100 kWe — veto energético compartilhado</text>
  </g>
</svg>
