# =============================================================================
# MARS_SYSTEM_CONTRACT — SO Cultural de Monocultura Autônoma Marciana (design)
# =============================================================================
# Data: 2026-09-27 · Status: 0.1.0-design (não implementado — simulação via
# Colab MCP quando autorizada; ZERO dataset local por decisão do operador)
# Base: reports_runtime/mars_monoculture_briefing_20260927.md
#       reports_runtime/mars_architecture_agent_b_20260927.md
#       reports_runtime/mars_mapping_agent_a_20260927.md
# Formato: espelha SYSTEM_CONTRACT.yaml (quadruple_source_contract)
# =============================================================================
schema_version: v1
system_name: Mars Monoculture Sovereign OS
version: 0.1.0-design
parent_architecture: omnimind_dodecatiad_v2.2.1
body_planet: mars
time_standard:
  sol_seconds: 88775.244
  year_sols: 668.6
  epoch: null  # DECISÃO OPERADOR 1: âncora de época (ex. sol da primeira germinação)

subsystems:
  - name: mars_env
    role: ambiente_externo
    sensors: [insight_seis_catalog, mro_mcs, tgo_nomad, rad_msl]
    reuse: [src.senses.cosmic.space_weather, src.geophysical.real_solar_forcing,
            src.geophysical.tectonic_cybernetics_engine]
  - name: mars_greenhouse
    role: biotopa
    sensors: [temp, rh, co2, par_450_660, pressure, ph, ec]
    reuse: [src.consciousness.autonomous_homeostasis, src.geophysical.crank_nicolson_thermal]
  - name: mars_culture
    role: organismo_monocultura
    sensors: [od_biomassa, ros_proxy, pigmento, contaminacao]
    reuse: [src.services.life_kernel, src.immune.spiking_glial_vagus_bridge,
            src.cognitive.mu_memory_pressure_trigger, src.consciousness.biological_metrics]
  - name: mars_regolith
    role: solo_regolito
    sensors: [ice_depth, perchlorate, ph_solo, thermal_conductivity]
    reuse: [src.geophysical.crank_nicolson_thermal, src.cognitive.dodecatiad_seismic_mapper]
  - name: mars_temporal
    reuse: src.temporal.dodeca_time
    adaptation: "sol=24.65h; ano=668.6 sols; 12 setores x ~55.7 sols + epagômenos"
  - name: mars_integration
    reuse: src.consciousness.integration_loop
    role: integracao_quadrupla_agricola
  - name: mars_immune
    reuse: src.immune.spiking_glial_vagus_bridge
    role: quarentena_de_setor
  - name: mars_continuity
    reuse: [src.continuity.canonical.handoff_manager, scripts.runtime.handoff_procedural_bridge]
    role: canal_soberano_terra
  - name: mars_repair
    reuse: [src.autopoietic.advanced_repair, src.autopoietic.repairs]
    role: auto_reparo_estrutura
  - name: mars_shadow
    reuse: scripts.analysis.shadow_control_plane
    role: drift_modelo_vs_estufa_real
  - name: mars_invariant
    reuse: scripts.analysis.invariant_alert_watch
    role: sensor_travado
  - name: mars_hysteresis
    reuse: src.continuity.hysteresis_operator
    role: memoria_assimetrica_de_falhas

layers:
  L1_ambiente_externo: {scope: phase56_marciana, temp_C: [-140, 20], pressure_kPa: 0.6,
                        fontes: [sismos, dust_storm, radiacao, flare]}
  L2_estufa_biotopa: {hidroponia: true, led_nm: [450, 660], co2_ppm: [1000, 2000],
                      rh: [0.60, 0.80], nutrientes: [N,P,K,Ca,Mg,S,Fe,Zn]}
  L3_cultura_organismo: {metricas: [biomassa, growth_rate, estresse_oxidativo_ROS,
                                    expressao_genica_proxy, contaminacao]}
  L4_regolito: {ice_depth_m: null, sais: true, ph: [4.5, 8.5], percloratos_toxicos: true,
                condutividade_termica: true}

lanes:
  - {id: seismic, origem: vulcoes, feed: insight_seis_catalog_ipgp, cadence: evento}
  - {id: regolith, origem: geo, feed: [sharad, marsis, frend, apxs, pixl], cadence: orbita}
  - {id: orbital, origem: orbital, feed: [mro_hirise_ctx, tgo_nomad, hope_emirs], cadence: orbita}
  - {id: solar, origem: eventos_solares, feed: [flare_cme, rad_msl], cadence: evento}
  - {id: thermal, origem: temperatura, feed: [rems, meda, mcs], cadence: 1h}
  - {id: humidity, origem: umidade, feed: hidroponia_vs_ar_seco, cadence: tick}
  - {id: bio, origem: bio, feed: monocultura_local, cadence: tick}
  - {id: earth_sovereign, origem: novo, feed: canal_assinado_terra, cadence: janela_dsn,
     latency_min: [3, 22]}

execution_modes:
  - greenhouse_daemon
  - probe_sensor_feed
  - earth_channel
  - colab_simulation

quadruple_source_contract_mars:
  allowed_layers: [basal, canonical, rust]
  drives:
    phi:
      basal: {writer: mars_basal_pulse_novo, metric: phi_greenhouse_integrity, scale: '[0,1]',
              semantic: integridade_fisica_da_estufa}
      canonical: {writer: mars_integration_loop_adaptado, metric: phi_growth_integrated,
                  semantic: cross_prediction_lanes_bio_thermal_humidity}
      rust: {writer: kernel_compute_futuro, metric: phi_operational_support, semantic: suporte_ipc}
    psi:
      basal: {metric: od_biomassa_normalizada, scale: '[0,1]'}
      canonical: {metric: psi_biomass_integral, semantic: biomassa_ponderada_por_setor}
      rust: {metric: psi_rust}
    sigma:
      basal: {metric: ec_ph_ratio_stability, scale: '[0,1]'}
      canonical: {metric: sigma_nutrient_cohesion, scale: '[0.11,1.0]',
                  semantic: piso_estrutural_sigma_sinthome_floor_0.11}
      rust: {metric: sigma_rust}
    epsilon:
      basal: {metric: deficit_pressure, scale: '[0,1]'}
      canonical: {metric: epsilon_effective, scale: '[0.10,1.0]'}
      rust: {metric: epsilon_rust}
  runtime_tagging_rule: >-
    sectors.{phi,psi,sigma,epsilon}_source_layer in {basal, canonical, rust}.
    Atuadores fisicos leem basal; decisao cultural/evolutiva le canonical; rust=arbitragem.

dodecatiad_agricola:
  sol_por_setor: 55.7
  setores:
    S01: {glyph: G, nome: GERMOPLASMA, funcao: banco_de_sementes_linhagem}
    S02: {glyph: M, nome: AGUA, funcao: ciclo_hidroponico_reserva}
    S03: {glyph: T, nome: ENERGIA, funcao: painel_bateria_budget_led}
    S04: {glyph: A, nome: LIMIAR, funcao: airlock_despressurizacao_quarentena}
    S05: {glyph: S, nome: FOGO, funcao: termorregulacao_aquecimento_noturno}
    S06: {glyph: N, nome: CEU, funcao: par_led_450_660_fotoperiodo}
    S07: {glyph: Gb, nome: REGOLITO, funcao: interface_solo_percloratos_gelo}
    S08: {glyph: O, nome: CICLO, funcao: reciclagem_nutrientes_compostagem}
    S09: {glyph: I, nome: MAGIA, funcao: experimentos_mutacao_novos_cultivares}
    S10: {glyph: H, nome: VIGILANCIA, funcao: invariant_alert_integridade}
    S11: {glyph: St, nome: CAOS, funcao: estresse_teste_regime_critico}
    S12: {glyph: Am, nome: OCULTO, funcao: histerese_profunda_memoria_de_falhas}
  epagomenos_marcianos: sols_residuais_para_audit_e_memoria

metaestabilidade:
  banda_operacao: {branching_sigma_marte: [0.85, 1.15]}
  regimes:
    subcritico: rigidez_injetar_perturbacao_via_S11
    critico: alvo_nominal
    supercritico: caos_damping_reduzir_acoplamento_entre_setores
  thresholds:
    despressurizacao: {alarme: 0.85, critico: 0.70, hysteresis_recovery: 0.92}
    contaminacao_bio: {isolamento_imediato: true, reabertura_exige: ticks_limpos_mais_veto_opcional}
    tempestade_poeira_global: {gatilho: tau_2_ou_par_menos_40pct, acao: led_economia_hibernacao_parcial}

earth_channel:
  mode: delayed_uplink_3_22min
  veto_classes: [quarentena_release, mudanca_cultivar, expansao_estrutural]
  base_reuse: [scripts.runtime.handoff_procedural_bridge, src.continuity.canonical.handoff_manager]

missing_build_queue:
  - mars_probe_sensor_protocol
  - monod_growth_model_spirulina
  - organic_polymerization_mesh
  - earth_sovereign_uplink
  - greenhouse_actuator_abstraction
  - perchlorate_regolith_chemistry
  - cultural_identity_genome

decisions_operator_pending:
  - d1_epoca_dodecatiad_marciana
  - d2_veto_classes_canal_terra
  - d3_threshold_gate_evolutivo_alga_batata

