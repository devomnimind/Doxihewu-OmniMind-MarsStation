# ---- AMCI efetivo com risco de buffer (2026-09-28) ----
amci_effective:
  formula: "AMCI_eff = AMCI_nominal x (0.85 + 0.15 x p_agua) x (0.85 + 0.15 x p_energia)"
  p_agua: "min(min_agua_l / reservatorio_l * 8, 1.0)"       # 12.5% do reservatório = 1.0
  p_energia: "min(max((energia_min - 0.50) / 0.10, 0), 1.0)"  # 0.50->0, 0.60->1.0 (gate d3)
  nominal: 0.9676
  v2_integrada_base: 0.8111    # p_agua 0.068 — buffer quase vazio
  v3_fix_agua: 0.8935
  v4_fix_energia: 0.8324
  v5_fixes_ambos: 0.9169
  v7_clima_extremo: 0.9189     # melhor config efetiva
  nota: "o nominal (0.968) não capturava risco de buffer; min_água e margem de energia são as métricas reais de segurança"
