# =============================================================================
# APÊNDICE 2026-09-28 — DECISÕES DO OPERADOR (d1 sítio, d2 veto, d3 gate)
# Decisões finais registradas — fonte: operador, sessão 2026-09-28.
# =============================================================================
operator_decisions:
  d1_site:
    decision: "15N_140E — zona de transição Gale<->Elysium"
    rationale: "gelo<5m (SHARAD/FREND), temperatura moderada, poeira aceitável, sismicidade longe de Cerberus Fossae, pressão suficiente p/ painéis"
    comparison:
      - gale: "clima quente -63C, percloratos altos 0.5-1%, gelo profundo >50m inviável"
      - elysium: "gelo raso <2m confirmado, mas frio -70C, poeira alta, sismos Mw>4"
    sources: [SHARAD_MRO, FREND_TGO, SEIS_InSight_174_eventos, CRISM_OMEGA]
  d2_veto_classes:
    decision: "3 níveis — autonomia_total / veto_consultative / veto_mandatory"
    autonomy_total:
      - photoperiod_adjustment
      - nutrient_balance
      - ph_co2_regulation
      - sector_quarantine_local
      - routine_cultivation
      - hysteresis_threshold_adjustment
    veto_consultative:
      - greenhouse_expansion
      - cultivar_rotation_same_class
      - mutation_experiments_S09
      - controlled_perturbation_S11
    veto_mandatory:
      - quarantine_release_global
      - dominant_cultivar_change
      - structural_expansion
      - mission_abort
      - permanent_hibernation
    analogy_omnimind: "basal->autonomia_total; canonical->veto_consultative; rust->veto_mandatory"
  d3_gate_evolution:
    decision: "gate por score de estabilidade + duração + reservas; transições irreversíveis"
    algae_to_potato:
      stability_score_min: 0.90
      duration_min_sols: 55.7
      epsilon_max: 0.15
      energy_reserve_min: 0.60  # 0.50->0.60 (ação E5 black swan: margem 2% insuficiente)
      water_reserve_min: 0.60
      nutrient_reserve_min: 0.30
      pilot_duration_sols: 55.7
      pilot_success: "yield>0.5 kg/m2/dia, contaminacao<5%, eficiencia>80%"
      max_sectors_per_cycle: 2
      rollback_possible: false
    potato_to_wheat:
      stability_score_min: 0.95
      duration_min_sols: 111.4
      epsilon_max: 0.10
      energy_reserve_min: 0.70
      water_reserve_min: 0.80
      nutrient_reserve_min: 0.50
      soil_volume_min_m3: 100
      pilot_duration_sols: 111.4
      pilot_success: "yield>0.3 kg/m2/dia, proteina>12%, contaminacao<2%"
      max_sectors_per_cycle: 3
