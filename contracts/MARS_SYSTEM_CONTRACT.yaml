# =============================================================================
# APÊNDICE 2026-09-27 — Especificação das 5 lacunas de construção (operador)
# Cada lacuna com path proposto e contrato de API. Código de referência do
# operador preservado nos relatórios mars_*_20260927.md.
# =============================================================================
missing_build_specs:
  gap_1_monod_growth_model:
    path: src/agriculture/monod_growth_model.py
    class: MonodGrowthModel
    api:
      - {init: {mu_max: 0.3, K: 2.0, crop_type: spirulina}}
      - {step: {light_umol_m2_s, temp_c, ph, co2_percent, nutrients, dt_days: 1}, returns: biomass_kg_m3}
      - {reset: {}}
    math: "mu = mu_max * light_factor * temp_factor * ph_factor * co2_factor * nutrient_factor"
    factors:
      light: "min(1.0, light/200)  # 200 umol/m2/s ideal"
      temp: "exp(-((temp-37)^2)/(2*5^2))  # sigma=5C (spirulina 35-40C)"
      ph: "exp(-((ph-9.5)^2)/(2*1^2))  # sigma=1 pH (spirulina 8.5-11)"
      co2: "min(1.0, co2/3)  # 3% CO2 ideal"
      nutrients: "min(nutrients.values())  # lei do minimo (Liebig)"
    growth: "mu * biomass * (1 - biomass/K)  # logístico"
    crop_defaults:
      spirulina: {mu_max: 0.3, K: 2.0, temp_ideal: 37, ph_ideal: 9.5, co2_ideal: 3.0, light_ideal: 200}
      potato: {mu_max: 0.1, K: 8.0, temp_ideal: 20, ph_ideal: 6.0, co2_ideal: 1.5, light_ideal: 400}
      dwarf_wheat: {mu_max: 0.08, K: 10.0, temp_ideal: 22, ph_ideal: 6.5, co2_ideal: 1.5, light_ideal: 500}
    tests: tests/agriculture/test_monod_growth_model.py
    validation: "curva 30 dias reproduzível; biomass clamp [0, K]; fatores em [0,1]"

  gap_2_greenhouse_actuators:
    path: src/agriculture/greenhouse_actuators.py
    class: GreenhouseActuators
    actuators:
      - led_array: {wavelengths: [450, 660], max_intensity: 1.0}
      - co2_valve: {max_ppm: 2000}
      - nutrient_pumps: {elements: [N,P,K,Ca,Mg,S,Fe,Zn]}
      - heater: {max_power_kw: 5}
      - mister: {flow_rate_l_h: 10}
    api:
      - {execute: {type, intensity|ppm|amount, ...}}
      - {read_state: {}, returns: dict_dos_atuadores}
      - {safety_override: {}}  # canal Terra pode forçar
    actions_supported:
      - increase_light
      - decrease_light
      - inject_co2
      - inject_nutrients
      - heat
      - mist
      - emergency_shutdown
    principle: "geophysical decide; atuadores executam; invariant vigia; shadow valida antes"

  gap_3_perchlorate_chemistry:
    path: src/agriculture/perchlorate_chemistry.py
    class: PerchlorateChemistry
    api:
      - {init: {threshold_ppm: 1000}}
      - {is_safe: {perchlorate_ppm}, returns: bool}
      - {remediate: {soil_sample}, returns: soil_sample_modificado}
      - {leach_water_needed: {perchlorate_ppm}, returns: litros}
    model:
      toxicity_threshold_ppm: 1000
      reduction_per_cycle: 0.9  # 90% por ciclo de lavagem + bactérias redutoras
      methods: [water_leaching, perchlorate_reducing_bacteria, electrolysis]
    gate: "L4 gate obrigatório antes de usar regolito in-situ (só após is_safe)"

  gap_4_earth_sovereign_channel:
    path: src/agriculture/mars_earth_handoff.py  (adapta src/continuity/canonical/handoff_manager.py)
    class: MarsEarthHandoff
    api:
      - {init: {latency_min: [3, 22], veto_classes: [quarantine_release, cultivar_change, structural_expansion]}}
      - {send_to_earth: {message}, returns: queued}
      - {receive_from_earth: {}, returns: mensagem_ou_none}
      - {execute_with_veto: {decision}, returns: executed|vetoed}
    properties:
      latency: "uniforme 3-22min (ida e volta)"
      conjuction_windows: "conjunção solar: sem canal por ~2 semanas (store-and-forward)"
      ordering: "reordena por sol (fora de ordem permitido)"
      veto: "Terra vence SÓ em veto_classes; resto consultivo"
      idempotency: "mensagens com handoff_id (base: handoff_procedural_bridge)"

  gap_5_cultural_identity_genome:
    path: src/agriculture/cultural_genome.py  (adapta src/narrative_consciousness/meaning_maker.py)
    class: CulturalGenome
    api:
      - {init: {station_name: Chryse_Planitia_Alpha}}
      - {log_event: {event_type, severity, lesson}, returns: memória_append}
      - {get_decision: {options}, returns: melhor_opcao_por_valores}
      - {narrative_snapshot: {}, returns: texto_narrativo}
    values_default:
      survival: 1.0
      biomass_production: 0.9
      resource_efficiency: 0.7
      experimentation: 0.5
    memory: "eventos marcados: traumas (despressurização, contaminação) + conquistas (colheita, adaptação)"
    learning: "lesson atualiza values (histerese de valores — espelha hysteresis_operator)"
    integration: "alimenta narrative_consciousness e o DriveState de life_kernel"

build_order: [gap_2, gap_3, gap_1, gap_4, gap_5]  # atuadores→química→crescimento→canal→identidade
