# =============================================================================
# APÊNDICE 2026-09-27 — MÁQUINA-ÁRVORE (arquitetura de autopoiese por descoberta)
# Visão do operador: corpo = árvore; raízes = braços mecânicos que escavam;
# elevadores entre braços; circunferência de 2-3km entre braços.
# Documento completo: reports_runtime/mars_tree_architecture_20260927.md
# =============================================================================
tree_architecture:
  status: design_v1
  geometry:
    trunk: "nucleo_central (energia, agua, germoplasma, estufa vertical, laboratorio, radio_terra)"
    arms: "12_bracos_raiz (Dodecatíade agrícola; espacamento 2-3km na circunferência; raio ~4-5km)"
    elevator: "anel_subterraneo_pressurizado (sistema circulatório: nutrientes, agua, amostras, energia, modulos)"
    redundancy: "anel_fechado_2_caminhos (falha de trecho -> caminho alternativo)"
  autopoiesis_loop:
    - "escanear: orbitais (MOLA/HiRISE/CRISM) + locais (temp/vento/sismos)"
    - "escavar: bracos perfuram regolito em profundidade crescente"
    - "analisar: composicao, percloratos, sais, gelo, pH, condutividade (gate is_safe)"
    - "cruzar: solo x clima real (REMS/MEDA) x histerese x quadrupla -> decisao de cultivo"
    - "adaptar: ajuste da estufa setorial, transplante via elevadores, quarentena"
    - "recordar: memoria cultural (S12 OCULTO) — arvore cresce em conhecimento"
  data_support:
    rems_gale: "116.6GB / 7168 sols clima real (Curiosity)"
    meda_jezero: "8.1GB segunda regiao (Perseverance)"
    mola: "5.3GB topografia global (MEGDR 16+128ppd)"
    seis: "2716 eventos sismicidade (InSight v14)"
  mapping_reuse:
    - "dodecatiad_agricola -> 12 bracos"
    - "soma_fluid_storage -> transplante via elevadores"
    - "spiking_glial_vagus -> quarentena de braco"
    - "mu_memory_pressure -> pressao de recursos"
    - "pressure_degrade -> hibernacao sob poeira"
    - "invariant_alert_watch -> sensor travado por braco"
    - "gravitational_ear/SEIS -> sismicidade"
    - "crank_nicolson_thermal -> termica do regolito"
    - "cosmic_observation_memory -> memoria de descobertas"
  data_gaps_next:
    - hirise_ctx_tiles_sitio
    - crism_omega_mineralogia_percloratos
    - apxs_chemmam_pixl_composicao
    - maven_radiacao
    - mola_polar
    - insight_hp3_fluxo_termico
  decision_operator:
    - "sitio_referencia: gale_para_calibracao + jezero_segunda_regiao"
    - "n_bracos_simulacao: 12_recomendado (dodecatíade completa)"
updated_at: '2026-09-27T02:30:00Z'

# =============================================================================
# APÊNDICE 2026-09-28 — LACUNAS CRÍTICAS (química/geoquímica/ecologia/sensores)
# Acréscimo do operador após revisão: o ciclo autotrófico exige mais que CO2/O2.
# Código de referência completo: relatório do operador (sessão 2026-09-28).
# =============================================================================
missing_build_specs_critical:
  gap_6_sabatier_and_perchlorates:
    path: src/agriculture/sabatier_reactor.py + src/agriculture/perchlorate_reducer.py
    priority: alta
    sabatier: "CO2 + 4H2 -> CH4 + 2H2O (300-400C, Ni/Al2O3, 95% conversão) — MOXIE-derivado; CH4 combustível + H2O de eletrólise"
    perchlorate: "ClO4- + 8e- + 8H+ -> Cl- + 4H2O — biológica (Dechloromonas, 90%/ciclo) ou eletroquímica (catodo Ti/Pt 2-3V, 95%); threshold 1000 ppm (is_safe gate)"
    sources: [MOXIE_122g_O2_12g_h, Sabatier_ISS, Dechloromonas_Azospira_solo_simulado]
  gap_7_regolith_geochemistry:
    path: src/agriculture/regolith_processor.py
    priority: media
    composition: "sulfatos (MgSO4/CaSO4 — fonte S), oxidos de Fe (hematita/magnetita — abrasivos), argilas filossilicatos (agua antiga, retem nutrientes), pH 4.5-8.5"
    process: "moagem -> separacao magnetica (remove Fe2O3) -> lixiviacao acida H2SO4 0.1M (Mg 0.85/Ca 0.75/K 0.70/P 0.60/Fe 0.90) -> neutralizacao -> troca ionica (ajusta NPK)"
    sources: [APXS_Curiosity_Perseverance, ChemCam_LIBS, PIXL_100um]
  gap_8_nitrogen_cycle:
    path: src/agriculture/nitrogen_cycle.py
    priority: alta
    fixacao: "N2 atmosferico 2.7% em Marte -> NH3/NH4+ (nitrogenase; Rhizobium/Azotobacter/cianobacterias); 0.05 kg N fixado/kg N2/dia"
    nitrificacao: "NH4+ -> NO2- (Nitrosomonas) -> NO3- (Nitrobacter); 90% eficiencia — forma assimilavel"
    desnitrificacao: "NO3- -> N2 em anaerobiose — MONITORAR (perda); alerta se O2 < 5%"
    sources: [BIOS-3_1972, MELiSSA_ESA]
  gap_9_microbiome_ecology:
    path: src/agriculture/microbiome_manager.py
    priority: media
    inoculum: "micorrizas 1e6 esporos/g + fixadores 1e7 CFU/g + solubilizadores de P 1e6 CFU/g (Bacillus/Pseudomonas)"
    monitor: "indice Shannon >= 2.0, respiracao do solo, atividade de fosfatase — alerta low_microbiome_diversity"
    consorcio: "nao monocultura pura: bacterias + algas + fungos (Spirulina + consorcio)"
    sources: [MARS-500, solo_antartico_McMurdo, cianobacterias_ESA_NASA]
  gap_10_advanced_sensors:
    path: src/agriculture/advanced_sensors.py
    priority: baixa
    suite: "espectrometro de massa (gases traco CH4/NH3/H2S/VOC), HPLC (aminoacidos/acucares), MinION DNA (microbioma em tempo real), NV centers em diamante (campos magneticos fracos)"
    sources: [SAM_Curiosity, MinION_ISS, NV_centers_Nature_2020]
  gap_11_life_support_systems:
    path: src/agriculture/life_support_systems.py
    priority: media
    systems: "reator de algas (Spirulina O2+proteina 60-70%), digestor anaerobio (biomassa -> CH4+CO2+digestate), fuel cell (H2+O2 -> H2O+energia), reator de plasma (residuos -> syngas CO+H2)"
    sources: [MELiSSA, BIOS-3, fuel_cells_ISS]
  build_order_critical: [gap_6, gap_8, gap_7, gap_9, gap_11, gap_10]
